services:
  - type: web
    name: autofixai-store
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./api.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORE_NAME
        sync: false
      - key: STORE_SHIPPING_FEE_THB
        value: "0"
      - key: STORE_TAX_POLICY
        value: included
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false