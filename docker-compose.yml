services:
  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: autofix-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      SESSION_SECRET: ${SESSION_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORE_SHIPPING_FEE_THB: ${STORE_SHIPPING_FEE_THB:-0}
      STORE_TAX_POLICY: ${STORE_TAX_POLICY:-included}
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autofix-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8123:80"
    restart: unless-stopped

volumes:
  sqlite_data:
